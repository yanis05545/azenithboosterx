# nama_node|nilai|kelas|grup
#
# Katalog node FPSGO (MediaTek). Diterapkan HANYA pada node yang benar-benar ada di
# /sys/kernel/fpsgo, /proc/fpsgo, /sys/module/mtk_fpsgo/parameters (kedalaman 2),
# berstatus rw, dan bernilai SATU angka (node berformat lain dilewati).
#
# kelas : safe    = selalu
#         aggr    = hanya preset extreme ATAU THERMAL_MODE=hard
#         thermal = hanya THERMAL_MODE=hard
# grup  : satu grup = satu unit uji A/B. Tiap grup diterapkan, FPS game DIUKUR dari
#         sistem (fpsgo_status / SurfaceFlinger), dan grup dibuang bila FPS turun.
#         Hasil disimpan per game (/data/adb/thermalx/learn/<paket>.fpsgo).
#
# Nama diambil dari driver MTK FPSGO v1-v3 (fbt/fstb/common); tidak semua kernel punya
# semuanya dan semantik nilai bisa beda antar vendor -> itu sebabnya ada uji A/B.
# Selain tabel ini, grup "disc" otomatis memasukkan node biner (0/1) bernama
# *rescue* / *boost* / *ultra* yang ditemukan di device (lihat scan/fpsgo_candidates.txt).
#
# Salin ke /data/adb/thermalx/fpsgo_profile.conf untuk mengubah (menggantikan file ini).
fpsgo_enable|1|safe|core
fbt_enable|1|safe|core
fstb_enable|1|safe|core
boost_ta|1|safe|core
enable_uclamp|1|safe|uclamp
rescue_enable|1|safe|rescue
rescue_second_enable|1|safe|rescue
sbe_rescue_enable|1|safe|rescue
ultra_rescue|1|safe|ultra
enable_switch_sync_flag|1|safe|sched
enable_switch_cap_margin|1|safe|margin
enable_ceiling|0|aggr|ceiling
thrm_enable|0|thermal|fbtthermal
